<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<title>Phone</title>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- 애플 기기가 아닌 곳(윈도우·안드로이드)에서 볼 때 애플 서체와 가장 비슷한 대체 서체 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--sb:54px;--safe-b:28px;--blue:#007aff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0e0e10}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;color:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;-webkit-user-select:text;user-select:text}
img{display:block}

/* ---------- 기기 프레임 ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#2a2a30,#0e0e10 70%)}
#phone{position:relative;flex:none;width:419px;height:878px;padding:13px;border-radius:70px;background:#1b1b1d;box-shadow:inset 0 0 0 2px #4a4a4f,inset 0 0 0 6px #111,0 40px 90px rgba(0,0,0,.6);transform-origin:center center}
.hw{position:absolute;width:4px;background:#3a3a3e;border-radius:2px}
.hw.act{left:-3px;top:120px;height:32px}.hw.vu{left:-3px;top:180px;height:62px}.hw.vd{left:-3px;top:256px;height:62px}
.hw.pw{right:-3px;top:210px;height:100px;cursor:pointer}.hw.cc{right:-3px;top:520px;height:56px;opacity:.7}
#screen{position:relative;width:393px;height:852px;border-radius:57px;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none;isolation:isolate;--wall:linear-gradient(165deg,#1d3b72 0%,#5b3a8e 45%,#e9806b 100%)}
#wall{position:absolute;inset:0;background:var(--wall);background-size:cover;background-position:center}
.layer{position:absolute;inset:0}
.hidden{display:none!important}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000;z-index:100}
#statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 38px;font-size:17px;font-weight:600;z-index:60;pointer-events:none;color:#000;transition:color .2s}
#statusbar .r{display:flex;gap:6px;align-items:center}
#statusbar svg{fill:currentColor}
#screen.sbw #statusbar{color:#fff}
#homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:#000;z-index:65;cursor:pointer}
#homebar{touch-action:none;cursor:grab}
#homebar::before{content:"";position:absolute;inset:-22px -40px -8px}
#screen.sbw #homebar{background:#fff}
@media (max-width:520px){
  :root{--sb:max(env(safe-area-inset-top),26px);--safe-b:max(env(safe-area-inset-bottom),14px)}
  #stage{background:#000}
  #phone{width:100vw;height:100dvh;padding:0;border-radius:0;box-shadow:none;background:#000}
  .hw,#island,#statusbar{display:none}
  #screen{width:100%;height:100%;border-radius:0}
}

/* ---------- 잠금화면 ---------- */
#lock{z-index:30;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--sb) + 14px);transition:transform .45s cubic-bezier(.3,.7,.2,1),opacity .45s;cursor:pointer;touch-action:none}
#lock::before{content:"";position:absolute;inset:0;background:var(--wall);background-size:cover;background-position:center;z-index:-1}
#lock.up{transform:translateY(-100%);opacity:.2}
.lk-date{font-size:20px;font-weight:600;opacity:.92;margin-top:8px}
.lk-time{font-size:94px;font-weight:600;letter-spacing:-2px;line-height:1.05}
.lk-bottom{position:absolute;bottom:calc(var(--safe-b) + 26px);left:46px;right:46px;display:flex;justify-content:space-between}
.lk-btn{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
.lk-btn svg{width:22px;height:22px}
.lk-hint{position:absolute;bottom:calc(var(--safe-b) + 4px);left:0;right:0;text-align:center;font-size:13px;opacity:.75}
.pc{position:absolute;inset:0;background:rgba(15,15,25,.55);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--sb) + 70px);cursor:default}
.pc-t{font-size:20px}
.pc-dots{display:flex;gap:22px;margin:22px 0 46px}
.pc-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.pc-dots i.f{background:#fff}
.pc-pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.pc-pad button{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pc-pad button:active{background:rgba(255,255,255,.45)}
.pc-pad small{font-size:10px;letter-spacing:2px;font-weight:600;margin-top:3px}
.pc-cancel{position:absolute;bottom:calc(var(--safe-b) + 20px);right:56px;color:#fff;font-size:17px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}


/* ---------- 홈화면 ---------- */
#home{z-index:1;display:flex;flex-direction:column;padding:calc(var(--sb) + 16px) 12px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:20px;justify-items:center}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:5px;width:80px;cursor:pointer}
.tile{position:relative;width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tile svg{width:36px;height:36px}
.app-ic:active .tile{filter:brightness(.75)}
.lbl{font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap}
.badge{position:absolute;top:-7px;right:-7px;min-width:23px;height:23px;border-radius:12px;background:#ff3b30;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px}
.widget{grid-column:span 2;grid-row:span 2;width:158px;height:166px;align-self:center;border-radius:24px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:16px;display:flex;flex-direction:column}
.widget .wd{font-size:13px;font-weight:700;color:#ffb4a8;text-transform:uppercase}
.widget .wn{font-size:44px;font-weight:300;line-height:1.05}
.widget .wt{margin-top:auto;font-size:13px;opacity:.85;line-height:1.35}
.hsearch{align-self:center;margin-top:auto;margin-bottom:12px;padding:6px 14px;border-radius:14px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:13px;font-weight:600}
.dock{margin:0 0 14px;height:92px;border-radius:34px;background:rgba(255,255,255,.24);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center}
.dock .lbl{display:none}

/* ---------- 알림 배너 ---------- */
#banner{position:absolute;left:10px;right:10px;top:calc(var(--sb) - 2px);z-index:70;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:24px;background:rgba(245,245,247,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 8px 30px rgba(0,0,0,.25);transform:translateY(calc(-100% - 90px));visibility:hidden;transition:transform .45s cubic-bezier(.3,1.25,.5,1),visibility 0s .45s;cursor:pointer}
#banner.show{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
.bn-ic{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.bn-ic svg{width:24px;height:24px}
.bn-tx{flex:1;min-width:0;font-size:15px;line-height:1.3}
.bn-top{display:flex;justify-content:space-between}.bn-top span{font-size:13px;color:#777}
.bn-msg{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 앱 공통 ---------- */
#app{z-index:20;background:#fff;overflow:hidden}
#app.open{animation:appin .34s cubic-bezier(.2,.8,.2,1)}
@keyframes appin{from{transform:scale(.25);opacity:0;border-radius:50px}to{transform:none;opacity:1}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;overflow:hidden}
.view.push{animation:push .32s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.nav{flex:none;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sb) + 2px) 14px 6px;min-height:calc(var(--sb) + 44px)}
.nav .ttl{font-size:17px;font-weight:600}
.back{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px}
.back svg{width:13px;height:21px}
.bigtitle{font-size:34px;font-weight:700;padding:0 16px 8px;letter-spacing:-.5px}
.srch{margin:0 16px 10px;height:36px;border-radius:10px;background:#eeeef0;color:#8e8e93;display:flex;align-items:center;padding:0 9px;gap:6px;font-size:16px}
.lrow{display:flex;align-items:center;gap:12px;padding:0 16px;cursor:pointer}
.lrow:active{background:#ececf0}
.lbody{flex:1;min-width:0;padding:11px 0;border-bottom:.5px solid #d1d1d6}
.l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.l1 b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:14px;color:#8e8e93;flex:none}
.l2{font-size:15px;color:#8e8e93;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.sub{font-size:13px;color:#8e8e93;margin-top:2px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;object-fit:cover;flex:none}
.av.sq{border-radius:38%}
.tabbar{flex:none;display:flex;justify-content:space-around;padding:7px 0 var(--safe-b);border-top:.5px solid rgba(0,0,0,.15);background:rgba(249,249,249,.96)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#8e8e93;min-width:70px;position:relative}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--blue)}
.empty{padding:120px 30px;text-align:center;color:#8e8e93;font-size:15px;line-height:1.5}

/* ---------- 채팅 공통 ---------- */
.chat-nav{flex:none;display:flex;align-items:center;padding:var(--sb) 10px 8px;min-height:calc(var(--sb) + 60px);position:relative}
.msgs{padding:10px 12px 14px;display:flex;flex-direction:column;gap:2px}
.row{display:flex}.row.me{justify-content:flex-end}.row.gap{margin-top:9px}
.b{max-width:260px;padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.32;word-break:break-word;white-space:pre-wrap}
.mimg{max-width:210px;border-radius:16px}
.receipt{align-self:flex-end;font-size:11px;color:#8e8e93;margin:3px 4px 0}
.typing .b{display:flex;gap:4px;align-items:center;padding:12px 14px}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9a9f;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
.composer{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px var(--safe-b)}
.composer input{flex:1;min-width:0;height:36px;border-radius:18px;border:1px solid #d1d1d6;padding:0 14px;font-size:16px;outline:0;background:#fff}
.cplus{width:34px;height:34px;border-radius:50%;background:#e9e9eb;color:#7c7c80;font-size:24px;line-height:1;flex:none;display:flex;align-items:center;justify-content:center}
.sendbtn{width:32px;height:32px;border-radius:50%;background:#0a84ff;color:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.sendbtn svg{width:16px;height:16px}

/* 메시지(문자) */
.imsg .chat-nav{flex-direction:column;justify-content:flex-end;gap:4px;background:rgba(247,247,249,.96);border-bottom:.5px solid rgba(0,0,0,.12)}
.imsg .cn-back{position:absolute;left:8px;top:calc(var(--sb) + 10px)}
.imsg .cn-name{font-size:11px;display:flex;align-items:center;gap:2px}
.imsg .me .b{background:#0a84ff;color:#fff}
.imsg .them .b{background:#e9e9eb}
.udot{width:10px;height:10px;border-radius:50%;flex:none;margin-right:-6px}.udot.on{background:#0a84ff}

/* 톡 */
.talk{background:#b2c7da}
.talk .chat-nav{background:#b2c7da;gap:8px}
.talk .chat-nav b{flex:1;font-size:17px}
.talk .msgs{gap:5px}
.talk .them{gap:8px;align-items:flex-start}
.talk .avs{width:38px;flex:none}
.talk .tcol{display:flex;flex-direction:column;gap:4px}
.talk .tname{font-size:12px;color:#33404d}
.talk .bm{display:flex;align-items:flex-end;gap:5px}
.talk .b{max-width:220px;border-radius:15px;padding:8px 11px;font-size:15px}
.talk .them .b{background:#fff}.talk .me .b{background:#fee500}
.talk .meta{display:flex;flex-direction:column;align-items:flex-end;font-size:10px;color:#4b5866;white-space:nowrap}
.talk .them .meta{align-items:flex-start}
.talk .one{color:#e8b800;font-weight:700;font-size:11px}
.talk .composer{background:#fff;padding-top:8px}
.talk .composer input{border:0;background:#f1f1f3;border-radius:18px}
.talk .sendbtn{background:#fee500;color:#3a3a3a;border-radius:10px}
.datesep{align-self:center;background:rgba(0,0,0,.12);color:#fff;font-size:12px;padding:4px 12px;border-radius:12px;margin:6px 0}
.talkapp .tk-head{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sb) + 8px) 18px 10px}
.talkapp .tk-head b{font-size:22px}
.talkapp .tk-head span{display:flex;gap:16px}.talkapp .tk-head svg{width:24px;height:24px}
.talkapp .lrow{padding:8px 18px;gap:12px}
.tk-mid{flex:1;min-width:0}.tk-mid b{font-size:15px}
.tk-mid .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:#999;align-self:flex-start;padding-top:4px}
.tk-badge{background:#ff4b2b;color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.tk-sec{font-size:12px;color:#888;padding:14px 18px 4px;border-top:.5px solid #eee;margin-top:6px}
.talkapp .tab.on{color:#111}
.tkprof{background:linear-gradient(#7d8fa3,#4b5a6b);color:#fff;align-items:center}
.tkprof .x{position:absolute;left:18px;top:calc(var(--sb) + 8px);font-size:28px;color:#fff}
.tkprof .pmain{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-bottom:30px}
.tkprof .pmain b{font-size:20px}
.tkprof .pacts{width:100%;display:flex;justify-content:center;gap:50px;padding:20px 0 calc(var(--safe-b) + 16px);border-top:.5px solid rgba(255,255,255,.3)}
.tkprof .pacts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#fff}
.tkprof .pacts svg{width:26px;height:26px}

/* SNS DM */
.dm .chat-nav{gap:10px;border-bottom:.5px solid #eee}
.dm .chat-nav .nm{flex:1;line-height:1.2}.dm .chat-nav .nm b{font-size:16px;display:block}.dm .chat-nav .nm span{font-size:12px;color:#888}
.dm .them{gap:7px;align-items:flex-end}.dm .avs{width:28px;flex:none}
.dm .me .b{background:#3d7bf7;color:#fff;border-radius:22px}
.dm .them .b{background:#efefef;border-radius:22px}
.dm .composer input{border:0;background:#efefef;border-radius:22px;height:42px}
.dm .sendbtn{background:#3d7bf7}

/* ---------- 전화 ---------- */
.kp-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px 24px}
.kp-num{font-size:36px;min-height:46px;letter-spacing:1px;text-align:center;word-break:break-all}
.kp-sub{font-size:15px;color:var(--blue);min-height:20px;margin-top:4px}
.kp-pad{display:grid;grid-template-columns:repeat(3,78px);gap:15px 26px;justify-content:center}
.kp-pad button{width:78px;height:78px;border-radius:50%;background:#e5e5ea;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;line-height:1}
.kp-pad button:active{background:#bdbdc2}
.kp-pad small{font-size:10px;letter-spacing:2px;font-weight:600;margin-top:2px}
.kp-act{display:grid;grid-template-columns:repeat(3,78px);gap:26px;justify-content:center;padding:16px 0 18px;align-items:center}
.kp-call{width:78px;height:78px;border-radius:50%;background:#34c759;display:flex;align-items:center;justify-content:center}
.kp-call svg{width:36px;height:36px;fill:#fff}
.kp-del{font-size:26px;color:#a0a0a5}
.rc-in{color:#ff3b30}
.cdetail{align-items:center}
.cdetail .cd-name{font-size:30px;margin:10px 0 18px}
.cd-acts{display:flex;gap:8px;padding:0 16px;width:100%}
.cd-acts button{flex:1;background:#f2f2f7;border-radius:12px;padding:10px 0;color:var(--blue);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cd-acts svg{width:22px;height:22px;fill:currentColor}
.cd-info{width:calc(100% - 32px);background:#f2f2f7;border-radius:12px;padding:10px 14px;margin-top:14px;cursor:pointer}
.cd-info small{font-size:13px}.cd-info div{color:var(--blue);font-size:17px;margin-top:2px}

/* 통화 화면 */
#call{z-index:40;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--sb) + 46px);background:linear-gradient(170deg,#44566b,#1b222c 70%)}
.cl-status{font-size:17px;opacity:.85;min-height:22px}
.cl-name{font-size:34px;margin-top:4px;text-align:center;padding:0 20px}
.cl-grid{margin-top:auto;display:grid;grid-template-columns:repeat(3,76px);gap:22px 30px}
.cl-grid button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#fff}
.cl-grid .c{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.cl-grid .on .c{background:#fff;color:#1b222c}
.cl-grid svg{width:30px;height:30px}
.cl-bottom{display:flex;justify-content:center;gap:110px;padding:40px 0 calc(var(--safe-b) + 40px)}
.cl-bottom button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:#fff}
.cl-end,.cl-ok{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cl-end{background:#ff3b30}.cl-ok{background:#34c759}
.cl-end svg,.cl-ok svg{width:34px;height:34px;fill:#fff}
.cl-end svg{transform:rotate(135deg)}
.cl-incoming .cl-grid{visibility:hidden}

/* ---------- 브라우저 ---------- */
.br{background:#fff}
.br-top{flex:none;height:var(--sb);background:#f7f7f8}
.br-page{position:relative}
.br-page iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.br-bar{flex:none;background:rgba(247,247,248,.97);border-top:.5px solid rgba(0,0,0,.12);padding:8px 14px var(--safe-b)}
.br-pill{display:flex;align-items:center;gap:8px;height:44px;border-radius:13px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.12);padding:0 12px}
.br-pill input{flex:1;min-width:0;border:0;outline:0;text-align:center;font-size:16px;background:transparent}
.br-pill input:focus{text-align:left}
.br-pill span{color:#555;font-size:14px}
.br-tools{display:flex;justify-content:space-between;padding:8px 6px 0}
.br-tools button{color:var(--blue);width:44px;height:30px;display:flex;align-items:center;justify-content:center}
.br-tools button:disabled{color:#c4c4c8}
.br-tools svg{width:24px;height:24px}
.st-wrap{padding:30px 20px}
.st-wrap h3{font-size:20px;margin-bottom:16px}

.np-c{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s,background .2s}
.np-c:active{transform:scale(.88);background:rgba(255,255,255,.28)}
.np-c svg{width:18px;height:18px}
.np-bar{position:relative;height:24px;margin-top:22px;cursor:pointer;touch-action:none}
.np-bar::before{content:"";position:absolute;left:0;right:0;top:9px;height:7px;border-radius:4px;background:rgba(255,255,255,.22);transition:height .15s,top .15s}
.np-bar i{position:absolute;left:0;top:9px;height:7px;border-radius:4px;background:rgba(255,255,255,.72);transition:height .15s,top .15s}
.np-bar.drag::before,.np-bar.drag i{height:12px;top:6.5px}
.np-tm{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;margin-top:2px}
.np-ls{display:flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.8);font-size:12.5px}
.np-ls svg{width:18px;height:10px}
.np-ctl{display:flex;justify-content:space-around;align-items:center;margin:30px 10px 0}
.np-ctl button{display:flex;color:#fff;transition:transform .3s cubic-bezier(.3,1.5,.5,1),opacity .2s}
.np-ctl button:active{transform:scale(.85);opacity:.7}
.np-ctl [data-np=prev] svg,.np-ctl [data-np=next] svg{width:48px;height:34px}
.np-big svg{width:48px;height:48px}
.np-vol{display:flex;align-items:center;gap:14px;margin-top:34px;color:rgba(255,255,255,.6)}
.np-vol>i{display:flex}.np-vol>i svg{width:20px;height:20px}.np-vol>i:last-child svg{width:28px}
.np-vol .np-bar{flex:1;margin:0}
.np-bot{display:flex;justify-content:space-around;align-items:center;margin:22px 0 4px}
.np-bot button{display:flex;color:rgba(255,255,255,.6);position:relative;transition:opacity .2s}
.np-bot button:active{opacity:.4}
.np-bot svg{width:28px;height:28px}
.np-q em{position:absolute;right:-12px;top:-14px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff}
.np-q em svg{width:15px;height:15px}
.qp-info>div{cursor:pointer}

/* ===== 11차 수정 ===== */
.nt-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nt-top b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-top span{font-size:13px;color:rgba(60,60,67,.6);flex:none}
.nt-msg{font-size:15px;line-height:1.3;margin-top:1px}

/* ===== 12차 수정 ===== */
.mq{text-overflow:clip!important;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 18px),transparent)}
.mq-in{display:inline-flex;gap:44px;white-space:nowrap;animation:mqrun var(--mqt,8s) linear infinite;will-change:transform}
@keyframes mqrun{0%,22%{transform:translateX(0)}100%{transform:translateX(calc(-1 * var(--mqd,100px)))}}
.am-mp b,.qmx b,.qmx span{display:block;overflow:hidden;white-space:nowrap}
.mq .mq-in{display:inline-flex!important;overflow:visible!important;color:inherit!important;font:inherit!important;margin:0!important;max-width:none!important}
.mq .mq-in>span{display:inline!important;overflow:visible!important;color:inherit!important;font:inherit!important;text-overflow:clip!important;margin:0!important;max-width:none!important}

/* ===== 13차 수정 ===== */
@media (max-width:520px){
  html:not(.standalone){--sb:54px;--safe-b:28px}
  html:not(.standalone) #statusbar{display:flex}
  html:not(.standalone) #island{display:flex}
  html.standalone #island,html.standalone #statusbar{display:none!important}
}
#banner{transition:transform .5s cubic-bezier(.4,0,.2,1),visibility 0s .5s,opacity .3s;touch-action:none}
#banner.show{transition:transform .45s cubic-bezier(.3,1.25,.5,1)}
#nc .nt,#lock .nt{touch-action:pan-y;overflow:hidden}

.np-info{padding-top:12px}

                     안 쓰면 글자 수 × typingSpeed 로 자동 계산 (최대 maxDelay)

function matches(when,text){
  if(when==null||when==='*')return true;
  if(when instanceof RegExp)return when.test(text);
  if(Array.isArray(when))return when.some(w=>matches(w,text));
  return text.replace(/\s/g,'').includes(String(when).replace(/\s/g,''));
}
function pickReply(th,text){
  const rules=th.cfg.replies||[];
  for(let i=0;i<rules.length;i++){const r=rules[i];if(r.once&&th.used.has(i))continue;if(matches(r.when,text)){th.used.add(i);return r;}}
  const seq=th.cfg.sequence;
  if(seq&&th.seq<seq.length){const r=seq[th.seq++];return (typeof r==='string'||Array.isArray(r)||!('reply' in r))?{reply:r}:r;}
  if(th.cfg.fallback)return {reply:th.cfg.fallback};
  return null;
}
function send(app,id,text){
  text=text.trim();if(!text)return;
  const th=thread(app,id);
  th.msgs.push({from:'me',text,time:fmtTime(),ts:Date.now(),read:false,real:true,fresh:true});
  if(app==='messages')sfx('send');
  changed();
  const r=pickReply(th,text);if(!r)return;
  const items=[].concat(r.reply);
  th.q=th.q.then(()=>deliver(app,id,items,r));
}
async function deliver(app,id,items,r){
  const th=thread(app,id),D=CONFIG.replyDefaults||{},C=th.cfg;
  const pick=(k,item,dflt)=>item?.[k]??r[k]??C[k]??D[k]??dflt;
  await wait(pick('readDelay',null,900));
  th.msgs.forEach(m=>{if(m.from==='me')m.read=true});changed();
  for(const it of items){
    const item=typeof it==='string'?{text:it}:it;
    const pause=pick('pause',item,0);                 // 말풍선 뜨기 전 아무것도 없이 기다리는 시간
    if(pause)await wait(pause);
    const speed=pick('typingSpeed',item,70);          // 글자당 ms (delay 를 안 쓸 때 자동 계산용)
    const sentences=Math.max(1,String(item.text||'').split(/(?<=[.!?…~])\s+|\n+/).filter(x=>x.trim()).length);
    const d=app==='talk'?(item.delay??sentences*1000):(item.delay??r.delay??Math.min(800+(item.text||'').length*speed,pick('maxDelay',item,3200)));
    const showTyping=app==='talk'?false:pick('typing',item,true);        // false 면 입력중 말풍선 없이 기다렸다 도착
    th.typing=!!showTyping;changed();
    await wait(d);
    th.typing=false;
    incoming(app,id,item);
  }
}
function incoming(app,id,item){
  if(typeof item==='string')item={text:item};
  const th=thread(app,id);
  th.msgs.forEach(m=>{if(m.from==='me')m.read=true;});
  th.msgs.push({from:'them',text:item.text||'',image:item.image||'',time:fmtTime(),ts:Date.now(),read:true,real:true,fresh:viewing(app,id)});
  if(!viewing(app,id)){th.unread++;addNotif(app,id,threadName(app,id),item.text||'사진');showBanner(app,id,item);}
  changed();
}

function toneLoop(freqs,on,off,vol=.07){
  try{const ctx=ac(),g=ctx.createGain();g.gain.value=0;g.connect(ctx.destination);
    vol=vol*S.vol/.7;const os=freqs.map(f=>{const o=ctx.createOscillator();o.frequency.value=f;o.connect(g);o.start();return o;});
    let alive=true;const cyc=()=>{if(!alive)return;const t=ctx.currentTime;g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(0,t+on);setTimeout(cyc,(on+off)*1000)};cyc();
    return()=>{alive=false;try{os.forEach(o=>o.stop());g.disconnect()}catch(e){}};
  }catch(e){return()=>{}}
}
/* ---- iOS 기본음과 비슷하게 만든 합성 효과음 (애플 원본 파일은 저작권 때문에 넣을 수 없어요) ---- */
function sfx(name){
  if(CONFIG.sounds===false)return;
  try{const ctx=ac(),t=ctx.currentTime,V=S.vol/.7;
    const noise=(dur,freq,q,vol,at=0)=>{const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
      const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=vol*V;src.connect(f);f.connect(g);g.connect(ctx.destination);src.start(t+at);};
    const tone=(freq,dur,vol,at=0,to)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t+at);if(to)o.frequency.exponentialRampToValueAtTime(to,t+at+dur);
      g.gain.setValueAtTime(0,t+at);g.gain.linearRampToValueAtTime(vol*V,t+at+.005);g.gain.exponentialRampToValueAtTime(.0001,t+at+dur);o.connect(g);g.connect(ctx.destination);o.start(t+at);o.stop(t+at+dur+.02);};
    if(name==='click'){noise(.022,3800,.9,.55);tone(2600,.012,.05);}                       // 키보드·암호 키 클릭
    if(name==='lock'){noise(.03,1400,1.2,.7);tone(190,.05,.18);noise(.025,2400,1.2,.45,.07);}  // 잠금음
    if(name==='send'){tone(520,.2,.07,0,1700);noise(.18,2600,.6,.12);}                      // 메시지 보냄
    if(name==='recv'){tone(1318,.16,.07,0);tone(1047,.16,.07,.12);tone(1568,.32,.07,.24);}  // 메시지 받음 (세 음)
  }catch(e){}
}

(()=>{let s=null;const k=()=>(screen.getBoundingClientRect().width/screen.offsetWidth)||1;

    s={el,x:e.clientX,y:e.clientY,mode:null,pid:e.pointerId,dx:0,dy:0,ban:el.id==='banner'};},true);
  document.addEventListener('pointermove',e=>{if(!s||e.pointerId!==s.pid)return;const dx=(e.clientX-s.x)/k(),dy=(e.clientY-s.y)/k();
    if(!s.mode){if(dx<-8&&Math.abs(dx)>Math.abs(dy)*1.2)s.mode='x';else if(s.ban&&dy<-8&&Math.abs(dy)>Math.abs(dx))s.mode='y';else if(Math.abs(dx)>12||Math.abs(dy)>12)s.mode='none';
      if(s.mode==='x'||s.mode==='y'){if(s.ban)clearTimeout(s.el._t);try{s.el.setPointerCapture(s.pid)}catch(_){}}}
    if(s.mode==='x'){e.stopPropagation();s.dx=dx;s.el.style.transition='none';s.el.style.transform=`translateX(${Math.min(0,dx)}px)`;s.el.style.opacity=String(Math.max(.25,1+dx/400));}
    else if(s.mode==='y'){e.stopPropagation();s.dy=dy;s.el.style.transition='none';s.el.style.transform=`translateY(${Math.min(0,dy)}px)`;}},true);
  const up=e=>{if(!s||e.pointerId!==s.pid)return;const S2=s;s=null;if(!S2.mode||S2.mode==='none')return;

function startCall(target,incoming=false,ev={}){
  if(S.call)return;

  const c=contactById(target)||contactByPhone(target);
  const num=c?c.phone:target;
  const cfg={...(c?(c.call||{}):(CONFIG.unknownCall||{})),...(ev.audio?{audio:ev.audio}:{})};
  const C=S.call={c,num,cfg,incoming,state:'ringing',start:0,audio:null,stopTone:null,timer:null,flags:{}};
  callEl.className='layer'+(incoming?' cl-in':'');setSB();updStatus();
  callShell(C);callButtons(C);
  if(callEl.animate){callEl.animate([{opacity:0,transform:'scale(1.08)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'none'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)'});
    [...callEl.children].forEach((el,i)=>el.animate&&el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:380,delay:80+i*40,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}));}

    const x=e.target.closest('[data-x]')?.dataset.x;
    if(x==='end')endCall();
    if(x==='decline')endCall('missed');
    if(x==='accept')connect();
  };
  if(incoming){
    st.textContent='휴대전화';
    if(CONFIG.ringtone){const a=new Audio(CONFIG.ringtone);a.loop=true;a.play().catch(()=>{});C.stopTone=()=>a.pause();}
    else C.stopTone=toneLoop([1046,1318],.25,.35,.06);
    try{navigator.vibrate&&navigator.vibrate([400,300,400,300,400])}catch(e){}
    C.timer=setTimeout(()=>{if(S.call===C&&C.state==='ringing')endCall('missed')},30000);
  }else{
    st.textContent='연결 중...';
    C.stopTone=toneLoop([440,480],1,2);
    C.timer=setTimeout(()=>{
      if(S.call!==C)return;
      if(cfg.answer===false){
        if(cfg.noAnswerAudio){C.stopTone();C.audio=new Audio(cfg.noAnswerAudio);C.audio.play().catch(()=>{});C.audio.onended=()=>endCall();}
        else endCall();}
      else connect();
    },(cfg.ringSeconds??3)*1000);
  }
}
function connect(){
  const C=S.call;if(!C||C.state!=='ringing')return;
  clearTimeout(C.timer);C.stopTone&&C.stopTone();C.state='active';C.answered=true;C.start=Date.now();
  callEl.classList.remove('cl-in');callButtons(C);setIsland('call');

  const t=()=>{const s=Math.floor((Date.now()-C.start)/1000);st.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`};t();
  C.interval=setInterval(t,500);

function endCall(forceType){
  const C=S.call;if(!C||C.ended)return;C.ended=true;
  clearTimeout(C.timer);clearInterval(C.interval);C.stopTone&&C.stopTone();if(C.audio){C.audio.onended=null;C.audio.pause();}
  try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
  const type=forceType||(C.incoming?(C.answered?'in':'missed'):'out');
  const r0=S.recents[0];
  if(r0&&digits(r0.num)===digits(C.num)&&r0.type===type){r0.n=(r0.n||1)+1;r0.ts=Date.now();}else S.recents.unshift({num:C.num,type,ts:Date.now(),n:1});

  if(C.incoming&&C.state==='ringing')callButtons({...C,incoming:false});
  callEl.querySelector('.cl-status').textContent='통화 종료';
  callEl.classList.add('ended');

}

    }else if(e.type==='naver'||e.type==='google'){
      const img=e.type==='naver'?ASSETS.page_naver:ASSETS.page_google;

      const q=page.querySelector('.sf-q');q.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&q.value.trim()){ev.preventDefault();q.blur();go({type:'search',q:q.value.trim(),engine:e.type});}});
    }else if(e.type==='search'){
      const R=results(e.q),N=e.engine==='naver';
      page.innerHTML=N
        ?`<div class="srn"><form class="srn-box"><input value="${esc(e.q)}" enterkeyhint="search"><button>${SI.srch}</button></form>
           <div class="srn-tabs">${['통합','이미지','동영상','지식iN','인플루언서','뉴스','쇼핑'].map((t,i)=>`<span class="${i?'':'on'}">${t}</span>`).join('')}</div>
           ${R.map((r,i)=>`<div class="srn-it" data-r="${i}"><div class="sr-src">${fav(r)}<b>${esc(r.site)}</b><small>${esc(r.url)}</small></div><h3>${esc(r.title)}</h3><p>${esc(r.desc||'')}</p></div>`).join('')}</div>`
        :`<div class="srg"><form class="srg-box">${SI.srch}<input value="${esc(e.q)}" enterkeyhint="search"></form>
           <div class="srg-tabs">${['전체','이미지','동영상','뉴스','쇼핑','지도'].map((t,i)=>`<span class="${i?'':'on'}">${t}</span>`).join('')}</div>
           ${R.map((r,i)=>`<div class="srg-it" data-r="${i}"><div class="sr-src">${fav(r)}<div><b>${esc(r.site)}</b><small>https://${esc(r.url)}</small></div></div><h3>${esc(r.title)}</h3><p>${esc(r.desc||'')}</p></div>`).join('')}</div>`;
      page._R=R;
      page.querySelector('form').onsubmit=ev=>{ev.preventDefault();const val=page.querySelector('form input').value.trim();if(val)go({type:'search',q:val,engine:e.engine});};
    }else if(e.type==='sug'&&e.sg.youtube){

      page.innerHTML=`<div class="yt"><div class="yt-top"><span class="yt-logo"><svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5.2" fill="#ff0033"/><path d="M11.2 5.6v8.8l7.6-4.4z" fill="#fff"/></svg><b>YouTube</b></span>
        <span class="yt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3l5.2 5.2"/></svg><i class="yt-me">동현</i></span></div>
        <div class="yt-pl">${/^https?:$/.test(location.protocol)
          ?`<iframe src="https://www.youtube.com/embed/${id}?playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}&widget_referrer=${encodeURIComponent(location.href)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="YouTube video player"></iframe>`
          :`<a class="yt-poster" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')"><i></i></a>`}</div>
        <div class="yt-info"><h1>${esc(e.sg.title)}</h1><div class="yt-ch"><span class="yt-chav">${esc((e.sg.channel||'Y')[0])}</span><b>${esc(e.sg.channel||'')}</b><button>구독</button></div></div></div>`;
      const yf=page.querySelector('.yt-pl iframe');if(yf)yf.addEventListener('load',()=>{const say=()=>{try{yf.contentWindow.postMessage(JSON.stringify({event:'listening',id:'yt1',channel:'widget'}),'*');}catch(_){}};say();setTimeout(say,800);});
    }else if(e.type==='sug'&&e.sg.frame){
      page.classList.add('fr');
      page.innerHTML=`<div class="sf-load"><i></i></div><iframe class="sf-frame" src="${esc(e.sg.frame)}" referrerpolicy="no-referrer" allow="geolocation; clipboard-write"></iframe>`;
      const fr=page.querySelector('.sf-frame'),ld=page.querySelector('.sf-load');
      fr.style.bottom=v.querySelector('.sf-bar').offsetHeight+'px';
      requestAnimationFrame(()=>ld.classList.add('go'));
      fr.addEventListener('load',()=>{ld.classList.add('done');setTimeout(()=>ld.remove(),350);});
    }else if(e.type==='result'||e.type==='sug'){
      const r=e.r||e.sg;
      page.innerHTML=r.page?`<div class="webpage">${r.page}</div>`:`<div class="sf-art"><small>${esc(r.site||r.title)}</small><h1>${esc(r.place||r.title)}</h1><div class="sf-art-u">${esc(r.url)}</div><p>${esc(r.desc||'')}</p></div>`;
    }else if(e.type==='page'){page.innerHTML=`<div class="webpage">${pages[e.k].html||''}</div>`;}
    else{page.innerHTML=`<div class="sf-err"><h2>Safari가 페이지를 열 수 없음</h2><p>서버를 찾을 수 없기 때문에 Safari가 페이지 ‘${esc(e.k)}’을(를) 열 수 없습니다.</p></div>`;}
  }
  inp.addEventListener('focus',()=>{v.classList.add('typing');setTimeout(()=>inp.select(),0);});
  inp.addEventListener('blur',()=>setTimeout(()=>v.classList.remove('typing'),100));
  pill.onsubmit=e=>{e.preventDefault();const q=inp.value;inp.blur();if(q.trim())go(q);};
  v.addEventListener('click',e=>{
    const f=e.target.closest('[data-fav]');if(f){const x=BR.favorites[+f.dataset.fav];if(x.url)go(x.url);return;}
    const sg=e.target.closest('[data-sg]');if(sg){const x=SUG[+sg.dataset.sg];return x.go?go(x.go):go({type:'sug',sg:x});}
    const r=e.target.closest('[data-r]');if(r&&page._R)return go({type:'result',r:page._R[+r.dataset.r]});
    const a=e.target.closest('a[href]');if(a&&page.contains(a)){const href=a.getAttribute('href');if(href&&!href.startsWith('#')){e.preventDefault();go(href);}return;}
    const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const k=t.dataset.a;
    if(k==='back'&&B.i>0){B.i--;load();}
    if(k==='fwd'&&B.i<B.hist.length-1){B.i++;load();}
    if(k==='tabs')go('');
  });
  go(opt.start||'');return v;
}

const SNS=CONFIG.sns;

const imgOr=(o,cls='pph')=>o.image?`<img src="${esc(o.image)}" alt="">`:`<div class="${cls}" style="background:${o.color||'#ccc'}">${esc(o.text||'')}</div>`;
function postHTML(p){const i=SNS.posts.indexOf(p),a=acct(p.account);
  return `<article class="post" data-p="${i}"><div class="ph">${avatar(a.avatar,a.name||p.account,32,a.color)}<b data-prof="${esc(p.account)}">${esc(p.account)}</b><span style="width:20px">${I.dots}</span></div>
  <div class="pimg" data-dbl="${i}">${imgOr(p)}<div class="bigheart">♥</div></div>
  <div class="pa"><span class="like ${p.liked?'on':''}" data-like="${i}">${I.hrt}</span><span>${I.cmt}</span><span>${I.send}</span><span class="bm">${I.bmk}</span></div>
  <div class="likes">좋아요 ${(p.likes+(p.liked?1:0)).toLocaleString()}개</div>
  ${p.caption?`<div class="cap"><b>${esc(p.account)}</b> ${esc(p.caption)}</div>`:''}
  ${(p.comments||[]).map(c=>`<div class="cmt"><b>${esc(c.account)}</b> ${esc(c.text)}</div>`).join('')}
  <div class="ptime">${esc(p.time||'')}</div></article>`;}
function bindPosts(v){
  let lastTap=0;
  v.addEventListener('click',e=>{
    const lk=e.target.closest('[data-like]');if(lk){toggleLike(v,+lk.dataset.like);return;}
    const d=e.target.closest('[data-dbl]');if(d){const t=Date.now();if(t-lastTap<320){const i=+d.dataset.dbl;if(!SNS.posts[i].liked)toggleLike(v,i);const hh=d.querySelector('.bigheart');hh.classList.remove('pop');void hh.offsetWidth;hh.classList.add('pop');}lastTap=t;return;}
    const pr=e.target.closest('[data-prof]');if(pr){pushView(snsProfileView(pr.dataset.prof));}
  });
}
function toggleLike(v,i){const p=SNS.posts[i];p.liked=!p.liked;v.querySelectorAll(`[data-p="${i}"]`).forEach(el=>{el.querySelector('.like').classList.toggle('on',p.liked);el.querySelector('.likes').textContent=`좋아요 ${(p.likes+(p.liked?1:0)).toLocaleString()}개`;});}
function profileHTML(hd){
  const a=acct(hd),mine=hd===SNS.me,ps=SNS.posts.filter(p=>p.account===hd);
  return `<div class="pf-top">${avatar(a.avatar,a.name||hd,84,a.color)}<div class="pf-stats"><div><b>${ps.length}</b>게시물</div><div><b>${(a.followers||0).toLocaleString()}</b>팔로워</div><div><b>${(a.following||0).toLocaleString()}</b>팔로잉</div></div></div>
   <div class="pf-bio"><b>${esc(a.name||'')}</b>${a.bio?'\n'+esc(a.bio):''}</div>
   <div class="pf-btns">${mine?'<button>프로필 편집</button><button>프로필 공유</button>':`<button class="pri">팔로우</button><button data-dm="${esc(hd)}">메시지</button>`}</div>
   <div class="pgrid">${ps.map(p=>`<div data-open="${SNS.posts.indexOf(p)}">${imgOr(p)}</div>`).join('')}</div>`;
}
function snsProfileView(hd){
  const v=h(`<div class="view"><div class="nav"><button class="back bk" style="color:#000">${I.chevL}</button><span class="ttl">${esc(hd)}</span><span style="width:20px">${I.dots}</span></div><div class="scroll">${profileHTML(hd)}</div></div>`);
  v._sb='dark';
  v.addEventListener('click',e=>{
    if(e.target.closest('.bk'))return popView();
    const dm=e.target.closest('[data-dm]');if(dm)return openThread('sns',dm.dataset.dm);
    const o=e.target.closest('[data-open]');if(o)pushView(postView(SNS.posts[o.dataset.open]));
  });
  return v;
}
function postView(p){
  const v=h(`<div class="view"><div class="nav"><button class="back bk" style="color:#000">${I.chevL}</button><span class="ttl">게시물</span><span style="width:20px"></span></div><div class="scroll">${postHTML(p)}</div></div>`);
  v._sb='dark';v.querySelector('.bk').onclick=popView;bindPosts(v);return v;
}
function storyView(hd){
  const a=acct(hd),s=(a.story||[])[0]||{};a.storySeen=true;
  const v=h(`<div class="view storyv"><div class="sv-bar"><i></i></div><div class="sv-h">${avatar(a.avatar,a.name||hd,32,a.color)}${esc(hd)}</div><div class="sv-c">${imgOr(s)}</div></div>`);

function dmList(){
  const v=h(`<div class="view"><div class="nav"><button class="back bk" style="color:#000">${I.chevL}</button><span class="ttl">${esc(SNS.me)}</span><span style="width:24px">${I.edit}</span></div><div class="scroll"><div class="srch">${I.search.replace('<svg','<svg width="16" height="16"')} 검색</div><div style="font-weight:700;padding:6px 16px 8px">메시지</div><div class="lst"></div></div></div>`);
  v._sb='dark';
  v._refresh=()=>{v.querySelector('.lst').innerHTML=sortedThreads('sns').map(th=>{const l=th.msgs.at(-1);
    return `<div class="lrow" data-dm="${esc(th.id)}" style="padding:8px 16px">${threadAvatar('sns',th.id,54)}<div class="tk-mid"><b style="font-weight:${th.unread?700:400}">${esc(threadName('sns',th.id))}</b><div class="sub" style="${th.unread?'color:#000;font-weight:600':''}">${th.unread?`새 메시지 ${th.unread}개`:esc(preview(l))} · ${esc(l.time)}</div></div>${th.unread?'<span class="udot on"></span>':''}</div>`}).join('')||'<div class="empty">메시지 없음</div>';};
  v.addEventListener('click',e=>{if(e.target.closest('.bk'))return popView();const d=e.target.closest('[data-dm]');if(d)openThread('sns',d.dataset.dm);});

function snsApp(){
  let tab='home';
  const v=h(`<div class="view sns"><div class="snb scroll"></div><div class="tabbar"></div></div>`);
  v._sb='dark';
  const body=v.querySelector('.snb'),bar=v.querySelector('.tabbar');
  function render(){
    const u=unreadOf('sns');
    if(tab==='home'){
      const st=Object.entries(SNS.accounts||{}).filter(([k,a])=>a.story&&a.story.length);
      const me=acct(SNS.me);
      body.innerHTML=`<div class="sns-head"><span class="wm">${esc(appName('sns'))}</span><span><span class="ib">${I.hrt}</span><span class="ib" data-dmlist>${I.send}${u?`<span class="badge">${u}</span>`:''}</span></span></div>
       <div class="stories"><div class="story"><div class="ring seen">${avatar(me.avatar,me.name,62,me.color)}</div><span>내 스토리</span></div>${st.map(([k,a])=>`<div class="story" data-story="${esc(k)}"><div class="ring ${a.storySeen?'seen':''}">${avatar(a.avatar,a.name||k,62,a.color)}</div><span>${esc(k)}</span></div>`).join('')}</div>
       ${SNS.posts.map(postHTML).join('')}`;
    }else if(tab==='search'){
      body.innerHTML=`<div style="height:calc(var(--sb) + 6px)"></div><div class="srch">${I.search.replace('<svg','<svg width="16" height="16"')} 검색</div><div class="pgrid">${SNS.posts.map((p,i)=>`<div data-open="${i}">${imgOr(p)}</div>`).join('')}</div>`;
    }else{
      body.innerHTML=`<div class="nav"><b style="font-size:20px">${esc(SNS.me)}</b><span style="width:24px">${I.dots}</span></div>${profileHTML(SNS.me)}`;
    }
    bar.innerHTML=[['home','',I.home],['search','',I.search],['profile','',I.person]].map(([k,l,ic])=>`<button class="tab ${tab===k?'on':''}" data-t="${k}">${ic}</button>`).join('');
  }
  v._refresh=render;
  bindPosts(v);
  v.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;body.scrollTop=0;return render();}
    if(e.target.closest('[data-dmlist]'))return pushView(dmList());

    const o=e.target.closest('[data-open]');if(o)pushView(postView(SNS.posts[o.dataset.open]));
  });
  render();return v;
}

function noteView(n){

/* ---------- 자동 이벤트 ---------- */
function runOnRead(app,id,R){
  [].concat(R.cancelGroup||[]).forEach(g=>(CONFIG.events||[]).forEach(ev=>{if(ev.group===g){ev._cancel=true;clearTimeout(ev._t);}}));
  const th=thread(app,id);
  th.q=th.q.then(async()=>{await wait((R.after??2)*1000);const L=R.messages||[];for(let i=0;i<L.length;i++){if(i)await wait((R.gap??1)*1000);incoming(app,id,L[i]);}
    const T=R.then;if(T)(T.messages||[]).forEach((m,i)=>setTimeout(()=>incoming(app,id,m),(i+1)*(T.every||300)*1000));});
}
function startEvents(){
  if(S.evStarted)return;S.evStarted=true;
  (CONFIG.events||[]).forEach(ev=>{ev._t=setTimeout(()=>fireEvent(ev),(ev.after||0)*1000);});
}
function fireEvent(ev){
  if(ev._cancel)return;
  if(ev.type==='call'){if(!S.call)startCall(ev.contact,true,ev);return;}
  const th=thread(ev.app,ev.thread);
  const items=[].concat(ev.text??ev.messages??[]);
  th.q=th.q.then(async()=>{for(let i=0;i<items.length;i++){if(i)await wait(items[i].delay||900);incoming(ev.app,ev.thread,items[i]);}
    if(ev.suggest){th.cfg.suggest=[].concat(ev.suggest);th.sugI=0;const top=nav.stack.at(-1);top&&top._setPh&&top._setPh();}});
}

  const close=()=>{v.style.pointerEvents='none';v.animate([{transform:getComputedStyle(v).transform==='none'?'none':getComputedStyle(v).transform},{transform:'translateY(100%)'}],{duration:330,easing:'cubic-bezier(.3,.7,.2,1)',fill:'forwards'}).onfinish=()=>{const k=nav.stack.indexOf(v);if(k>=0)nav.stack.splice(k,1);v.remove();const top=nav.stack.at(-1);top&&top._msUpd&&top._msUpd();setSB();};};
  v._close=close;
  v.querySelectorAll('[data-npbar]').forEach(bar=>{let drag=false;
    const set=e=>{const rc=bar.getBoundingClientRect(),k=Math.max(0,Math.min(1,(e.clientX-rc.left)/rc.width));
      if(bar.dataset.npbar==='vol'){setMusicVol(k);updSliders();}else{MS.pos=k*songDur(MS.i);if(MS.a&&MS.a.duration)MS.a.currentTime=MS.pos;}updNP(true);};
    bar.addEventListener('pointerdown',e=>{e.stopPropagation();drag=true;bar.classList.add('drag');try{bar.setPointerCapture(e.pointerId)}catch(_){}set(e);});
    bar.addEventListener('pointermove',e=>{if(drag)set(e);});
    const end=()=>{drag=false;bar.classList.remove('drag');};bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);});
  // 아래로 쓸어내리면 닫힘
  (()=>{let y0=null,dy=0,pid=null;const sc=()=>(screen.getBoundingClientRect().height/screen.offsetHeight)||1;
    v.addEventListener('pointerdown',e=>{if(e.target.closest('button,[data-npbar]'))return;y0=e.clientY;dy=0;pid=e.pointerId;});
    v.addEventListener('pointermove',e=>{if(y0===null||e.pointerId!==pid)return;dy=Math.max(0,(e.clientY-y0)/sc());if(dy>6){try{v.setPointerCapture(pid)}catch(_){}v.style.transition='none';v.style.transform=`translateY(${dy}px)`;}});
    const up=()=>{if(y0===null)return;y0=null;if(dy>110)return close();if(dy>6){v.style.transition='transform .35s cubic-bezier(.3,1.2,.5,1)';v.style.transform='';setTimeout(()=>v.style.transition='',380);}else if(dy<=6&&event&&event.target&&event.target.closest&&event.target.closest('.np-grab'))close();};
    v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);})();
  v.addEventListener('click',e=>{const b=e.target.closest('[data-np]');if(!b)return;const k=b.dataset.np;
    if(k==='play')msToggle();if(k==='next')msNext();if(k==='prev'){if((MS.pos||0)>3){MS.pos=0;if(MS.a)MS.a.currentTime=0;updNP(true);}else msPrev();}
    if(k==='star'){MS.star=!MS.star;updNP();updQP&&updQP();}});
  return v;
}
function updNP(tick){const v=appEl.querySelector('.np');if(!v)return;const sg=msSong();
  if(!tick){v.querySelector('.np-bg').style.backgroundImage=`url('${sg.art||''}')`;v.querySelector('.np-art').style.backgroundImage=`url('${sg.art||''}')`;
    mq(v.querySelector('.np-tt>b'),sg.title||'재생 중이 아님');mq(v.querySelector('.np-tt>span'),sg.artist||'');
    if(v._i!==undefined&&v._i!==MS.i)songSwap(v,'.np-art','.np-tt','.np-bg');v._i=MS.i;
    v.querySelector('[data-np=play]').innerHTML=MS.on?QPI.pause:QPI.play;v.querySelector('[data-np=star]').innerHTML=MS.star?QPI.starOn:QPI.star;v.classList.toggle('playing',!!MS.on);}
  const dur=songDur(MS.i),pos=Math.min(MS.pos||0,dur);
  v.querySelector('[data-npbar=seek] i').style.width=(pos/dur*100)+'%';v.querySelector('.np-cur').textContent=mmss2(pos);v.querySelector('.np-rem').textContent='-'+mmss2(dur-pos);
  v.querySelector('[data-npbar=vol] i').style.width=(S.vol*100)+'%';}
function pushNP(){const v=npView();pushView(v,false);v.classList.add('np-up');updNP();setTimeout(()=>v.classList.remove('np-up'),460);}
function qpHTML(){const sg=msSong();
  return `<div class="qp"><div class="qp-art" style="background-image:url('${sg.art||''}')"></div>
    <div class="qp-info"><div><b>${esc(sg.title||'재생 중이 아님')}</b><span>${esc(sg.artist||'')}</span></div><i class="qp-wave">${QPI.wave}</i></div>
    <div class="qp-bar" data-qpbar="seek"><i></i></div><div class="qp-tm"><span class="qp-cur">0:00</span><span class="qp-rem">-0:00</span></div>
    <div class="qp-ctl"><button data-qp="star">${MS.star?QPI.starOn:QPI.star}</button><button data-qp="prev">${QPI.prev}</button><button data-qp="play" class="qp-big">${MS.on?QPI.pause:QPI.play}</button><button data-qp="next">${QPI.next}</button><span></span></div>
    <div class="qp-vol"><i>${QPI.vlo}</i><div class="qp-bar v" data-qpbar="vol"><i></i></div><i>${QPI.vhi}</i></div>
    <button class="qp-air">${QPI.air}iPhone</button></div>`;}
function updQP(tick){const q=ccEl.querySelector('.qp');if(!q)return;const sg=msSong();
  if(!tick){q.querySelector('.qp-art').style.backgroundImage=`url('${sg.art||''}')`;mq(q.querySelector('.qp-info>div>b'),sg.title||'재생 중이 아님');mq(q.querySelector('.qp-info>div>span'),sg.artist||'');
    if(q._i!==undefined&&q._i!==MS.i)songSwap(q,'.qp-art','.qp-info>div');q._i=MS.i;
    q.querySelector('[data-qp=play]').innerHTML=MS.on?QPI.pause:QPI.play;q.querySelector('[data-qp=star]').innerHTML=MS.star?QPI.starOn:QPI.star;q.classList.toggle('playing',!!MS.on);}
  const dur=songDur(MS.i),pos=Math.min(MS.pos||0,dur);
  q.querySelector('[data-qpbar=seek] i').style.width=(pos/dur*100)+'%';q.querySelector('.qp-cur').textContent=mmss2(pos);q.querySelector('.qp-rem').textContent='-'+mmss2(dur-pos);
  q.querySelector('[data-qpbar=vol] i').style.width=(S.vol*100)+'%';}
function qpOpen(){if(ccEl.classList.contains('qx-open'))return;const inn=ccEl.querySelector('.cc-in');inn.insertAdjacentHTML('beforeend',qpHTML());updQP();
  const x=ccEl.querySelector('.qp'),r=qxRect();ccEl.classList.add('qx-open');
  if(r&&x.animate){x.animate([{transform:`translate(${r.dx}px,${r.dy}px) scale(${r.sx},${r.sy})`,opacity:.25},{transform:'none',opacity:1}],{duration:440,easing:'cubic-bezier(.2,.9,.2,1)'});
    [...x.children].forEach((el,i)=>el.animate([{opacity:0},{opacity:1}],{duration:260,delay:100+i*22,easing:'ease-out',fill:'backwards'}));}
  x.querySelectorAll('[data-qpbar]').forEach(bar=>{let drag=false;
    const set=e=>{const rc=bar.getBoundingClientRect(),k=Math.max(0,Math.min(1,(e.clientX-rc.left)/rc.width));
      if(bar.dataset.qpbar==='vol'){setMusicVol(k);if(S.call&&S.call.audio)S.call.audio.volume=k;updSliders();}else{const d=songDur(MS.i);MS.pos=k*d;if(MS.a&&MS.a.duration)MS.a.currentTime=MS.pos;}updQP(true);};
    bar.addEventListener('pointerdown',e=>{e.stopPropagation();drag=true;bar.classList.add('drag');try{bar.setPointerCapture(e.pointerId)}catch(_){}set(e);});
    bar.addEventListener('pointermove',e=>{if(drag)set(e);});
    const end=()=>{drag=false;bar.classList.remove('drag');};bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end);});}
function updSliders(){
  [['bright',S.bright],['vol',S.vol]].forEach(([k,v])=>{const el=ccEl.querySelector(`[data-sl=${k}]`);if(!el)return;
    el.querySelector('.fill').style.height=(v*100)+'%';
    el.querySelector('svg').style.color=v>.17?(k==='bright'?'#ffcc00':'#6e6e73'):'#fff';});
}
/* --- 열기/닫기 공통 --- */
function ovPrepare(kind){
  S.ov=kind;hideBanner();
  const el=kind==='nc'?ncEl:ccEl;kind==='nc'?renderNC():renderCC();
  el.classList.remove('hidden');el.style.transition='none';const inn=el.querySelector('.cc-in');if(inn)inn.style.transition='none';
  ovProgress(kind,0);setSB();updStatus();tick();
}
function ovProgress(kind,p){
  p=Math.max(0,Math.min(1,p));
  if(kind==='nc')ncEl.style.transform=`translateY(${(p-1)*100}%)`;
  else{ccEl.style.opacity=p;const inn=ccEl.querySelector('.cc-in');if(inn)inn.style.transform=`translateY(${(1-p)*-36}px) scale(${.9+.1*p})`;}
}
function ovAnim(kind){const el=kind==='nc'?ncEl:ccEl;el.style.transition='transform .38s cubic-bezier(.2,.85,.25,1),opacity .3s';const inn=el.querySelector('.cc-in');if(inn)inn.style.transition='transform .34s cubic-bezier(.2,.85,.25,1)';}
function ovOpen(kind){ovAnim(kind);ovProgress(kind,1);}
function ovClose(instant){
  const kind=S.ov;if(!kind)return;const el=kind==='nc'?ncEl:ccEl;
  S.ov=null;setSB();updStatus();tick();
  if(instant){el.classList.add('hidden');return;}
  ovAnim(kind);ovProgress(kind,0);setTimeout(()=>{if(S.ov!==kind)el.classList.add('hidden');},360);
}
/* --- 화면 맨 위에서 끌어내리기: 왼쪽~가운데 = 알림센터, 오른쪽 = 제어센터 --- */
(()=>{let y0=null,kind=null,H=1,moved=false;
  const sc=()=>(screen.getBoundingClientRect().height/screen.offsetHeight)||1;
  zone.addEventListener('pointerdown',e=>{if(S.locked||S.call||S.ov)return;
    const r=screen.getBoundingClientRect();kind=(e.clientX-r.left)/r.width>.62?'cc':'nc';
    y0=e.clientY;H=screen.offsetHeight;moved=false;try{zone.setPointerCapture(e.pointerId)}catch(_){}});
  zone.addEventListener('pointermove',e=>{if(y0===null)return;const dy=(e.clientY-y0)/sc();
    if(!moved){if(dy<6)return;moved=true;ovPrepare(kind);}
    ovProgress(kind,dy/(H*(kind==='nc'?.75:.4)));});
  const up=e=>{if(y0===null)return;const dy=(e.clientY-y0)/sc();y0=null;if(!moved)return;
    if(dy>H*(kind==='nc'?.18:.1))ovOpen(kind);else ovClose();};
  zone.addEventListener('pointerup',up);zone.addEventListener('pointercancel',up);})();
/* 알림센터: 위로 쓸어올려 닫기, 알림 탭하면 해당 대화로 */
(()=>{let y0=null,dy=0;
  ncEl.addEventListener('pointerdown',e=>{if(e.target.closest('[data-lb],[data-clear]'))return;y0=e.clientY;dy=0;});
  ncEl.addEventListener('pointermove',e=>{if(y0===null)return;dy=(e.clientY-y0)/((screen.getBoundingClientRect().height/screen.offsetHeight)||1);
    if(dy<-6){ncEl.style.transition='none';ncEl.style.transform=`translateY(${Math.min(0,dy)}px)`;}});
  const up=()=>{if(y0===null)return;y0=null;if(dy<-80)ovClose();else if(dy<-6){ovAnim('nc');ovProgress('nc',1);}};
  ncEl.addEventListener('pointerup',up);ncEl.addEventListener('pointercancel',up);
  ncEl.addEventListener('click',e=>{
    if(Math.abs(dy)>6)return;
    if(e.target.closest('[data-clear]')){S.notifs=[];renderNCList();return;}
    const ca=e.target.closest('[data-clear-app]');if(ca){clearNotifs(ca.dataset.clearApp);renderNCList();return;}
    if(e.target.closest('.nc-less'))return;
    const lb=e.target.closest('[data-lb]');if(lb){if(lb.dataset.lb==='flash'){S.cc.flash=!S.cc.flash;lb.classList.toggle('on',S.cc.flash);}return;}
    const n=e.target.closest('[data-napp]');if(!n)return;
    const app=n.dataset.napp,id=n.dataset.nid;ovClose(true);
    if(app==='phone'){openApp('phone');}else{openApp(app);openThread(app,id);}
  });})();
/* 제어센터: 버튼·슬라이더 조작, 빈 곳 탭하거나 위로 쓸어올리면 닫힘 */
(()=>{let y0=null,dy=0,sl=null,v0=0,hpx=1;
  const prOn=e=>{const b=e.target.closest('.qx-row:not(.dis),.qx-tile,.qm,.qc,.qs:not(.dis),.qctl button,.qtop button');if(b){if(b.classList.contains('qconn')||!b.closest('.qconn')||ccEl.classList.contains('qx-open'))b.classList.add('pr');else b.closest('.qconn').classList.add('pr');}};
  const prOff=()=>ccEl.querySelectorAll('.pr').forEach(b=>b.classList.remove('pr'));
  ccEl.addEventListener('pointerdown',prOn);ccEl.addEventListener('pointerup',prOff);ccEl.addEventListener('pointercancel',prOff);ccEl.addEventListener('pointerleave',prOff);
  ccEl.addEventListener('pointerdown',e=>{
    const s=e.target.closest('[data-sl]');
    if(s){sl=s.dataset.sl;v0=sl==='bright'?S.bright:S.vol;hpx=s.getBoundingClientRect().height;y0=e.clientY;try{ccEl.setPointerCapture(e.pointerId)}catch(_){}return;}
    sl=null;y0=e.clientY;dy=0;});
  ccEl.addEventListener('pointermove',e=>{if(y0===null)return;
    if(sl){const v=Math.max(0,Math.min(1,v0-(e.clientY-y0)/hpx));if(sl==='bright')S.bright=Math.max(.05,v);else{setMusicVol(v);if(S.call&&S.call.audio)S.call.audio.volume=v;if(typeof updQP==='function')updQP(true);if(typeof updNP==='function')updNP(true);}updSliders();updStatus();return;}
    dy=e.clientY-y0;});
  const up=e=>{if(y0===null)return;y0=null;if(sl){sl=null;return;}
    if(dy<-50)return ovClose();
    if(ccEl.classList.contains('qx-open')){if(Math.abs(dy)<8&&!e.target.closest('.qx-row,.qx-tile,.qp'))qxClose();return;}
    if(Math.abs(dy)<8&&!e.target.closest('.qm,.qtop button,.qpages'))ovClose();};
  ccEl.addEventListener('pointerup',up);ccEl.addEventListener('pointercancel',up);
  ccEl.addEventListener('click',e=>{
    if(!ccEl.classList.contains('qx-open')&&e.target.closest('.qconn')){qxOpen();return;}
    if(!ccEl.classList.contains('qx-open')&&e.target.closest('.qmed')&&!e.target.closest('[data-cc]')){qpOpen();return;}
    if(e.target.closest('.qp-info>div')&&!S.locked){ovClose(true);openApp('music');pushNP();return;}
    const qp=e.target.closest('[data-qp]');if(qp){const k=qp.dataset.qp;if(k==='play')msToggle();if(k==='next')msNext();if(k==='prev'){if((MS.pos||0)>3){MS.pos=0;if(MS.a)MS.a.currentTime=0;updQP(true);}else msPrev();}
      if(k==='star'){MS.star=!MS.star;updQP();}return;}
    const t=e.target.closest('[data-t]');
    if(t){const k=t.dataset.t;S.cc[k]=!S.cc[k];
      if(k==='plane'){if(S.cc.plane){S.cc._cell=S.cc.cell;S.cc.cell=false;}else S.cc.cell=S.cc._cell??false;}
      if(k==='cell'&&S.cc.cell&&S.cc.plane)S.cc.plane=false;
      updCC();updStatus();return;}
    const a=e.target.closest('[data-cc]')?.dataset.cc;
    if(a==='play')msToggle();if(a==='next')msNext();if(a==='prev')msPrev();

  });})();

/* 이 사이트 안의 어떤 링크도 실제 전화·문자·영상통화를 걸지 못하게 막음 */
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&/^(tel|sms|facetime|facetime-audio|mailto|callto):/i.test(a.getAttribute('href')))e.preventDefault();},true);

/* ---------- 시계 / 크기 맞춤 / 시작 ---------- */
let lastDay=now().getDate();
function tick(){
  $('#sb-time').textContent=(S.locked||S.ov)?(CONFIG.carrier||''):clock12();$('#sb-time').classList.toggle('car',!!(S.locked||S.ov));
  if(S.locked&&!lockEl.querySelector('.pc')&&lkY===null)renderLock();
  if(S.ov==='nc'){const t=ncEl.querySelector('.lk-time');if(t)t.textContent=clock12();}
  if(now().getDate()!==lastDay){lastDay=now().getDate();renderHome();}
}
setInterval(tick,1000);
function fit(){screen.classList.toggle('short',screen.offsetHeight<760);screen.style.setProperty('--sh',screen.offsetHeight+'px');const p=$('#phone');if(innerWidth<=520){p.style.transform='';return;}const s=Math.min(1,(innerHeight-30)/878,(innerWidth-30)/419);p.style.transform=`scale(${s})`;}
addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));fit();
renderLock();renderHome();tick();setSB();updStatus();
</script>
</body>
</html>
